name: Native validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$(cat .moonbit-toolchain)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          $env:MOONBIT_INSTALL_VERSION = (Get-Content .moonbit-toolchain -Raw).Trim()
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify pinned MoonBit toolchain
        if: runner.os != 'Windows'
        shell: bash
        run: |
          moon version --all | grep -F "moonc v$(cat .moonbit-toolchain) ("
          moon version --all | grep -F "moon $(cat .moon-version) ("

      - name: Verify pinned MoonBit toolchain on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $versions = moon version --all
          $compiler = (Get-Content .moonbit-toolchain -Raw).Trim()
          $cli = (Get-Content .moon-version -Raw).Trim()
          if (-not ($versions | Select-String -SimpleMatch "moonc v$compiler (")) {
            throw "MoonBit compiler $compiler is required"
          }
          if (-not ($versions | Select-String -SimpleMatch "moon $cli (")) {
            throw "MoonBit CLI $cli is required"
          }

      - name: Update Mooncakes registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check, test, and generate API info
        run: |
          moon check --target native --deny-warn --warn-list +73
          moon test --target native --deny-warn
          moon info --target native
